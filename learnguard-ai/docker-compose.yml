version: "3.9"

# LearnGuard AI Services Stack
# Runs alongside your existing Moodle installation.
# Moodle communicates with this stack via the ai-gateway (FastAPI) on port 8765.
#
# Prerequisites:
#   1. Install Docker Desktop (Windows) or Docker Engine (Linux/Mac)
#   2. Copy .env.example to .env and configure
#   3. Run: docker compose up -d
#   4. Set LEARNGUARD_AI_ENDPOINT=http://localhost:8765 in Moodle admin (LearnGuard → AI Settings)
#
# GPU support: add --gpus all to each AI service's deploy section if you have NVIDIA GPU.

services:

  # ── AI Gateway (FastAPI) ─────────────────────────────────────────────────────
  # All Moodle → AI traffic goes through this single endpoint.
  ai-gateway:
    build:
      context: ./ai-gateway
      dockerfile: Dockerfile
    container_name: learnguard-ai-gateway
    ports:
      - "8765:8765"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - OLLAMA_URL=http://ollama:11434
      - SOCKET_SERVER_URL=http://socket-server:3001
      - AI_WORKERS=${AI_WORKERS:-4}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    volumes:
      - ./ai-gateway:/app
      - ai-uploads:/app/uploads
      - ai-models:/app/models
    depends_on:
      - redis
      - ollama
    restart: unless-stopped
    networks:
      - learnguard-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8765/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Socket.IO Real-Time Server ───────────────────────────────────────────────
  # Handles live proctoring events, chat, alerts between proctor dashboard and students.
  socket-server:
    build:
      context: ./socket-server
      dockerfile: Dockerfile
    container_name: learnguard-socket
    ports:
      - "3001:3001"
    environment:
      - REDIS_URL=redis://redis:6379/1
      - MOODLE_WS_URL=${MOODLE_URL}/webservice/rest/server.php
      - SOCKET_SECRET=${SOCKET_SECRET:-changeme_secret_key}
      - NODE_ENV=production
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - learnguard-net

  # ── Ollama (Local LLM Runtime) ───────────────────────────────────────────────
  # Powers AI interviewing, candidate summaries, and essay analysis.
  # First run: docker exec learnguard-ollama ollama pull llama3.2
  ollama:
    image: ollama/ollama:latest
    container_name: learnguard-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    environment:
      - OLLAMA_NUM_PARALLEL=${OLLAMA_PARALLEL:-2}
    restart: unless-stopped
    networks:
      - learnguard-net
    # Uncomment for GPU support (requires nvidia-container-toolkit):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  # ── Redis (Cache + Message Queue) ───────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: learnguard-redis
    ports:
      - "6380:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    restart: unless-stopped
    networks:
      - learnguard-net

  # ── Nginx (Reverse Proxy for AI Gateway) ─────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: learnguard-nginx
    ports:
      - "8766:80"
    volumes:
      - ./nginx/learnguard-ai.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - ai-gateway
      - socket-server
    restart: unless-stopped
    networks:
      - learnguard-net

volumes:
  ai-uploads:
  ai-models:
  ollama-models:
  redis-data:

networks:
  learnguard-net:
    driver: bridge
